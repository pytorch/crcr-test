name: CRCR L2 Critical

on:
  repository_dispatch:
    types:
      - pull_request

run-name: >-
  L2 Health -
  PR #${{ github.event.client_payload.payload.pull_request.number }}
  (${{ github.event.client_payload.payload.action }})

concurrency:
  group: >-
    crcr-l2-${{ github.event.client_payload.payload.repository.full_name }}-${{
    github.event.client_payload.payload.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: write
  id-token: write

jobs:
  # Cleanup for abandoned PRs only. Merged PRs (closed + merged) fall through to
  # the l2-critical job instead of being treated as a plain close.
  cancel-workflow:
    if: >-
      github.event.client_payload.payload.action == 'closed' &&
      github.event.client_payload.payload.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert closed action skips L2 build job
        id: closed
        run: echo "PR closed — cancel-workflow job ran as expected"

      - name: Write closed-event health report
        if: always()
        run: |
          python3 tests/write_health_report.py \
            --probe l2-closed \
            --output health-report.json \
            --delivery-id "${{ github.event.client_payload.delivery_id }}" \
            --run-id "${{ github.run_id }}" \
            --event-type pull_request \
            --pr-number "${{ github.event.client_payload.payload.pull_request.number }}" \
            --check "closed_cancel=${{ steps.closed.outcome }}" \
            --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crcr-health-l2-closed-${{ github.run_id }}
          path: health-report.json

  # Only run when the PyTorch PR is merged, or when it carries the ciflow/crcr
  # label (opt-in pre-merge testing). Plain opened/synchronize without the label
  # is skipped to avoid running on every PR.
  l2-critical:
    if: >-
      (github.event.client_payload.payload.action == 'closed' &&
      github.event.client_payload.payload.pull_request.merged == true) ||
      (github.event.client_payload.payload.action != 'closed' &&
      contains(github.event.client_payload.payload.pull_request.labels.*.name,
      'ciflow/crcr'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout crcr-test
        uses: actions/checkout@v4

      - name: L2 — validate dispatch payload before callbacks
        id: validate_payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: echo "${CLIENT_PAYLOAD}" | python3 tests/validate_dispatch_payload.py

      - name: L2 — report in_progress to relay
        id: in_progress
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: in_progress

      - name: L2 — checkout PyTorch at dispatched SHA
        id: checkout_pytorch
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: ${{ github.event.client_payload.payload.pull_request.head.sha }}
          path: pytorch

      - name: L2 — verify checkout matches dispatch SHA
        id: verify_checkout
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "${CLIENT_PAYLOAD}" > /tmp/client_payload.json
          python3 tests/validate_pytorch_checkout.py \
            --payload /tmp/client_payload.json \
            --pytorch-dir pytorch

      - name: L2 — run deterministic smoke checks
        id: smoke
        run: |
          set -euo pipefail
          test -f pytorch/README.md
          test -d pytorch/.github
          python3 -c "import json; print('smoke ok')"

      - name: L2 — export probe step outcomes
        if: always()
        run: |
          {
            echo "VALIDATE_PAYLOAD=${{ steps.validate_payload.outcome }}"
            echo "IN_PROGRESS_CALLBACK=${{ steps.in_progress.outcome }}"
            echo "CHECKOUT_PYTORCH=${{ steps.checkout_pytorch.outcome }}"
            echo "VERIFY_CHECKOUT=${{ steps.verify_checkout.outcome }}"
            echo "SMOKE_CHECKS=${{ steps.smoke.outcome }}"
          } >> "$GITHUB_ENV"

      - name: L2 — build health metrics for HUD
        id: health_metrics
        if: always()
        run: |
          mapfile -t CHECK_ARGS < <(bash scripts/health_checks.sh l2-full)
          python3 tests/write_health_report.py \
            --probe l2-critical \
            --delivery-id "${{ github.event.client_payload.delivery_id }}" \
            --run-id "${{ github.run_id }}" \
            --event-type pull_request \
            --pr-number "${{ github.event.client_payload.payload.pull_request.number }}" \
            "${CHECK_ARGS[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: L2 — report completed with health metrics to relay/HUD
        id: completed
        if: always()
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ steps.health_metrics.outputs.conclusion || (job.status == 'success' && 'success' || 'failure') }}
          test-results: ${{ steps.health_metrics.outputs.test_results }}
          artifact-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Artifact uses one more check than HUD test_results: completed_callback
      # runs after the HUD POST, so its outcome is only known afterward.
      - name: L2 — write health report artifact
        id: health_final
        if: always()
        env:
          INCLUDE_COMPLETED_CALLBACK: "1"
          COMPLETED_CALLBACK: ${{ steps.completed.outcome }}
        run: |
          mapfile -t CHECK_ARGS < <(bash scripts/health_checks.sh l2-full)
          python3 tests/write_health_report.py \
            --probe l2-critical \
            --output health-report.json \
            --delivery-id "${{ github.event.client_payload.delivery_id }}" \
            --run-id "${{ github.run_id }}" \
            --event-type pull_request \
            --pr-number "${{ github.event.client_payload.payload.pull_request.number }}" \
            "${CHECK_ARGS[@]}" \
            --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crcr-health-l2-${{ github.run_id }}
          path: health-report.json

      - name: Write L2 integration summary
        if: always()
        run: |
          echo "### L2 Real-Time Dispatch Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Health metrics sent to HUD via \`completed\` callback \`test_results\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Integration point | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dispatch payload validation | ${{ steps.validate_payload.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| in_progress callback | ${{ steps.in_progress.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PyTorch checkout | ${{ steps.checkout_pytorch.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA verification | ${{ steps.verify_checkout.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke checks | ${{ steps.smoke.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| completed callback | ${{ steps.completed.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "HUD: [crcr-test dashboard](https://hud.pytorch.org/crcr/pytorch/crcr-test) (run_id \`${{ github.run_id }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "delivery_id: \`${{ github.event.client_payload.delivery_id }}\`" >> $GITHUB_STEP_SUMMARY
